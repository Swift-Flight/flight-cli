name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called by flight and flight-data so a breaking change there fails HERE,
  # on the pull request that caused it, rather than in a new user's first ten
  # minutes with a downloaded starter project.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  templates:
    name: ${{ matrix.tier }} (Swift 6.2.3)
    runs-on: ubuntu-latest
    container: swift:6.2.3
    strategy:
      fail-fast: false
      matrix:
        tier: [skeleton, basics, demo]

    steps:
      - name: Check the sibling-repository token is present
        run: |
          if [ -z "${{ secrets.SWIFTFLIGHT_CI_TOKEN }}" ]; then
            echo "::error::SWIFTFLIGHT_CI_TOKEN is not set. The templates are"
            echo "::error::verified against working copies of flight and"
            echo "::error::flight-data, which are private."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          path: flight-start

      - uses: actions/checkout@v4
        with:
          repository: Swift-Flight/flight
          token: ${{ secrets.SWIFTFLIGHT_CI_TOKEN }}
          path: flight

      - uses: actions/checkout@v4
        with:
          repository: Swift-Flight/flight-data
          token: ${{ secrets.SWIFTFLIGHT_CI_TOKEN }}
          path: flight-data

      - uses: actions/checkout@v4
        with:
          repository: Swift-Flight/hangar
          token: ${{ secrets.SWIFTFLIGHT_CI_TOKEN }}
          path: Hangar/hangar

      - uses: actions/checkout@v4
        with:
          repository: Swift-Flight/swift-changeset
          token: ${{ secrets.SWIFTFLIGHT_CI_TOKEN }}
          path: Data/swift-changeset

      # Builds and tests the tier against the checked-out working copies, not
      # against a published tag. Until v0.1.0 is tagged this is the only way
      # to verify them at all; after it, it is what catches a break before
      # the release rather than after.
      - name: Verify template
        working-directory: flight-start
        run: ./CI/verify-templates.sh ${{ matrix.tier }}
